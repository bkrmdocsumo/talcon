name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    strategy:
      matrix:
        include:
          - arch: arm64
            platform: darwin/arm64
            suffix: apple-silicon
          - arch: universal
            platform: darwin/universal
            suffix: universal
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Talon.app
        run: wails build -platform ${{ matrix.platform }}

      - name: Create DMG
        run: |
          APP_NAME="Talon"
          APP_BUNDLE="build/bin/talon.app"
          DMG_OUTPUT="build/Talon-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}.dmg"
          DMG_DIR="build/dmg"

          mkdir -p "${DMG_DIR}"
          cp -R "${APP_BUNDLE}" "${DMG_DIR}/${APP_NAME}.app"
          ln -s /Applications "${DMG_DIR}/Applications"

          hdiutil create \
            -srcfolder "${DMG_DIR}" \
            -volname "${APP_NAME}" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            "${DMG_OUTPUT}"

          rm -rf "${DMG_DIR}"
          echo "DMG_PATH=${DMG_OUTPUT}" >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Talon-${{ steps.version.outputs.VERSION }}-${{ matrix.suffix }}
          path: ${{ env.DMG_PATH }}

  release:
    needs: build-dmg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name '*.dmg'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect all DMG files
          DMG_FILES=$(find artifacts -type f -name '*.dmg')

          gh release create "${{ github.ref_name }}" \
            --title "Talon ${{ steps.version.outputs.VERSION }}" \
            --generate-notes \
            $DMG_FILES
